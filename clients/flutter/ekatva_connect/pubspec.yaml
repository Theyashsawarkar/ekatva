name: ekatva_connect
description: A Flutter app's link to ekatva, and through it to its other half on the laptop (Android).
version: 0.1.0
repository: https://github.com/Theyashsawarkar/ekatva
environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: io.github.theyashsawarkar.ekatva.connect
        pluginClass: EkatvaConnectPlugin
