plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.github.theyashsawarkar.ekatva'
version = '0.1.0'

android {
  namespace "io.github.theyashsawarkar.ekatva.phone"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Pairing's QR code (GmsBarcodeScanning): the scanner UI and model come from Play services.
  implementation "com.google.android.gms:play-services-code-scanner:16.1.0"
  // HeadlessJsTaskContext: keeping JS timers running in the background while linked.
  compileOnly "com.facebook.react:react-android"
}
